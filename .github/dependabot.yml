version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Match the Node 24 runtime; review this rule when upgrading Node.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      # React, its renderer and types must be updated together.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      development-tools:
        dependency-type: development
        exclude-patterns: ["@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        exclude-patterns: [react, react-dom]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
